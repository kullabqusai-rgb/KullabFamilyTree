<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موقع عائلة كلاب الجديد — Kullab.site</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://kullab.site">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1f3a2b 0%,#14110f 62%);color:#f2eadb;font-family:Tajawal,system-ui,sans-serif;text-align:center;overflow:hidden}
.box{max-width:440px;width:100%;animation:up 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
svg{width:110px;height:110px;margin-bottom:10px;animation:spin 24s linear infinite}
svg circle{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease forwards}
.a{stroke:#3fb97d}.b{stroke:#e0624f;animation-delay:.5s!important}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font:700 clamp(1.7rem,7vw,2.3rem)/1.3 "Reem Kufi",sans-serif;margin:0 0 10px}
p{margin:0 0 22px;color:#bfb5a2;line-height:1.9}
.url{direction:ltr;display:inline-block;font:700 1.5rem "Reem Kufi",sans-serif;letter-spacing:.08em;color:#fff;padding:8px 22px;border:1px solid #3a342b;border-radius:99px;margin-bottom:26px;background:#ffffff0a}
.url b{color:#3fb97d}
a.btn{display:block;width:fit-content;margin:0 auto;background:linear-gradient(90deg,#3fb97d,#2f9e69);color:#10130f;text-decoration:none;font-weight:700;font-size:1.1rem;padding:13px 40px;border-radius:99px;transition:transform .25s,box-shadow .25s;animation:glow 2.8s 1.5s infinite}
a.btn:hover{transform:translateY(-3px);box-shadow:0 10px 26px #3fb97d66}
@keyframes glow{50%{box-shadow:0 0 0 10px #3fb97d22}}
</style>
</head>
<body>
<div class="box">
<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="a" cx="60" cy="60" r="48" pathLength="1"/><circle class="b" cx="60" cy="60" r="30" pathLength="1"/></svg>
<h1>انتقلنا إلى موقعنا الجديد</h1>
<p>أنشأنا لعائلة كلاب موقعاً جديداً بشجرة أوضح وتصميم أجمل.</p>
<div class="url">Kullab<b>.site</b></div>
<a class="btn" href="https://kullab.site">الانتقال إلى الموقع الجديد</a>
</div>
</body>
</html>
